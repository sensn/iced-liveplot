[package]
name = "iced-liveplot"
version = "0.1.0"
edition = "2024"
publish = false
description = "Live plotting library for iced (ported from gpui-liveplot)"

[dependencies]
#iced = { path = "../iced", features = ["canvas", "tokio" ,"advanced"] } # for local dev 
iced = { git = "https://github.com/iced-rs/iced", branch = "master", features = ["canvas", "tokio", "advanced"] }
#iced = { git = "https://github.com/iced-rs/iced", rev = "cd04b74ca", features = ["canvas", "tokio", "advanced"] } # dev version


[[bin]]
name = "basic"
path = "src/bin/basic.rs"

[[bin]]
name = "advanced"
path = "src/bin/advanced.rs"
