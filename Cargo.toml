[package]
name = "iced-liveplot"
version = "0.1.0"
edition = "2024"
publish = false
description = "Live plotting library for iced (ported from gpui-liveplot)"

[dependencies]
#iced = { path = "../iced", features = ["canvas","advanced"] } # for local dev  - removed , "tokio" 
iced = { git = "https://github.com/iced-rs/iced", branch = "master", features = ["canvas",  "advanced", "fira-sans"] }
#iced = { git = "https://github.com/iced-rs/iced", rev = "cd04b74ca", features = ["canvas", "advanced"] } # dev version

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[[bin]]
name = "basic"
path = "src/bin/basic.rs"

[[bin]]
name = "advanced"
path = "src/bin/advanced.rs"
